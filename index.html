<style>
:root{--bg:#fff;--fg:#37352f;--mut:#787774;--line:#e3e2e0;--card:#f7f7f5;--acc:#2e9e48;--grad:linear-gradient(90deg,#2fb457,#dff03a);--ok:#0f7b6c;--bad:#e03e3e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#191919;--fg:#e6e6e4;--mut:#9b9a97;--line:#373737;--card:#252525;--acc:#5fd36f;--grad:linear-gradient(90deg,#2fb457,#dff03a);--ok:#4dab9a;--bad:#ff7369;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#191919;--fg:#e6e6e4;--mut:#9b9a97;--line:#373737;--card:#252525;--acc:#5fd36f;--grad:linear-gradient(90deg,#2fb457,#dff03a);--ok:#4dab9a;--bad:#ff7369;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:24px;display:grid;grid-template-columns:1.6fr 1fr;gap:24px}
@media(max-width:800px){.wrap{grid-template-columns:1fr}}
h1{font-size:34px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.mut{color:var(--mut)}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:24px;min-height:430px}
.lb{background:var(--card)}
button,input{font:inherit;color:inherit}
.btn{background:var(--grad);color:#14310f;border:0;border-radius:6px;padding:12px 22px;font-size:18px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--mut);border:1px solid var(--line);font-size:13px;padding:6px 10px;font-weight:400}
input.t{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:10px 12px;font-size:18px;width:100%}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:600;margin-bottom:10px}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:22px}
.bar i{display:block;height:100%;background:var(--grad);width:100%}
.task{font-size:26px;font-weight:700;margin-bottom:18px;min-height:70px}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-bottom:1px solid var(--line);font-size:20px;cursor:pointer;border-radius:6px}
.row:hover{background:var(--card)}
.cb{width:24px;height:24px;border:2px solid var(--mut);border-radius:4px;display:inline-flex;align-items:center;justify-content:center;color:#fff}
.cb.on{background:var(--acc);border-color:var(--acc)}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.col{background:var(--card);border-radius:8px;padding:10px;min-height:150px}
.col b{font-size:14px;color:var(--mut)}
.k{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:8px;cursor:pointer;font-size:17px;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.menu{border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg);box-shadow:0 4px 14px rgba(0,0,0,.15)}
.menu div{padding:10px 14px;font-size:18px;cursor:pointer}.menu div:hover{background:var(--card)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:12px 6px;border-bottom:1px solid var(--line);font-size:20px}
.tg{width:48px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;border:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.tg.on{background:var(--acc)}.tg.on::after{left:25px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.grid button{font-size:34px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:10px 18px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:20px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:18px}
th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line)}
th{color:var(--mut);cursor:pointer;user-select:none}th:hover{background:var(--card)}
ol{margin:0;padding-left:26px;font-size:20px}ol li{padding:6px 0;border-bottom:1px solid var(--line)}
ol li span{float:right;font-weight:700}
.big{font-size:90px;font-weight:800;text-align:center;margin:80px 0;color:var(--acc)}
.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{color:var(--ok)}
.center{text-align:center}
.logo{width:84px;height:84px;object-fit:contain}
.head{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.qr{width:150px;height:150px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:8px;border:1px solid var(--line)}
.qrbox{text-align:center;margin-top:18px}
</style></head>

var $=function(s){return document.querySelector(s)};
var stage=$('#stage');
// The shared leaderboard is stored in Supabase, not in browser localStorage.
var memLb=[];
function renderLb(){
  var el=$('#lb');el.innerHTML='';
  if(!memLb.length){el.innerHTML='<li class="mut">No scores yet. Be the first!</li>';return}
  memLb.slice(0,10).forEach(function(r){
    var li=document.createElement('li');
    li.textContent=r.n;
    var s=document.createElement('span');s.textContent=r.s;
    li.appendChild(s);el.appendChild(li);
  });
}
async function refreshLeaderboard(){
  var result = await db.from('notion_speedrun_scores')
    .select('player_name,score,created_at')
    .order('score',{ascending:false})
    .order('created_at',{ascending:true})
    .limit(10);
  if(result.error) throw result.error;
  memLb=(result.data||[]).map(function(r){return {n:r.player_name,s:r.score,created_at:r.created_at};});
  renderLb();
}
async function submitScore(playerName, playerScore){
  var result = await db.rpc('submit_notion_speedrun_score',{
    p_player_name: playerName,
    p_score: playerScore
  });
  if(result.error) throw result.error;
}
function showLeaderboardError(message){
  var el=$('#lb');
  el.innerHTML='';
  var li=document.createElement('li');
  li.className='mut';
  li.textContent=message;
  el.appendChild(li);
}
// A public visitor must not be able to erase the global leaderboard.
var resetButton=$('#reset');
if(resetButton && resetButton.parentElement) resetButton.parentElement.remove();
renderLb();
refreshLeaderboard().catch(function(err){
  console.error('Could not load the shared leaderboard:',err);
  showLeaderboardError('Leaderboard unavailable. Check Supabase setup.');
});
function h(tag,cls,txt,fn){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;if(fn)e.onclick=fn;return e}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){return a.slice().sort(function(){return Math.random()-.5})}

var name='',score=0,left=60,streak=0,t0=0,timer=null,last=-1,running=false;

function startScreen(){
  running=false;clearInterval(timer);
  stage.innerHTML='';
  var hd=h('div','head');var lg=document.createElement('img');lg.className='logo';lg.src=LOGO;lg.alt='Notion YU';hd.appendChild(lg);var ht=h('div');ht.appendChild(h('h1',null,'⚡ Notion Speedrun'));ht.appendChild(h('div','mut','Notion YU × JUST'));hd.appendChild(ht);stage.appendChild(hd);
  stage.appendChild(h('p','mut','60 seconds. As many Notion tasks as you can. Beat the campus leader!'));
  var inp=h('input','t');inp.placeholder='Your name';inp.maxLength=20;inp.value=name;
  stage.appendChild(inp);
  var b=h('button','btn','Start',function(){name=inp.value.trim()||'Player';countdown()});
  b.style.marginTop='16px';stage.appendChild(b);
  inp.onkeydown=function(e){if(e.key==='Enter')b.click()};
  setTimeout(function(){inp.focus()},50);
}
function countdown(){
  var n=3;stage.innerHTML='';var d=h('div','big',n);stage.appendChild(d);
  var c=setInterval(function(){n--;if(n<=0){clearInterval(c);begin()}else d.textContent=n},800);
}
function begin(){
  score=0;left=60;streak=0;running=true;
  stage.innerHTML='';
  var hud=h('div','hud');var sc=h('span',null,'Score: 0');sc.id='sc';var tm=h('span',null,'60s');tm.id='tm';
  hud.appendChild(sc);hud.appendChild(tm);stage.appendChild(hud);
  var bar=h('div','bar');var i=document.createElement('i');i.id='bi';bar.appendChild(i);stage.appendChild(bar);
  var t=h('div','task');t.id='task';stage.appendChild(t);
  var a=h('div');a.id='area';stage.appendChild(a);
  var end=Date.now()+60000;
  timer=setInterval(function(){
    left=Math.max(0,(end-Date.now())/1000);
    $('#tm').textContent=Math.ceil(left)+'s';$('#bi').style.width=(left/60*100)+'%';
    if(left<=0)finish();
  },100);
  nextTask();
}
function wrong(){streak=0;stage.classList.add('shake');setTimeout(function(){stage.classList.remove('shake')},300)}
function win(){
  if(!running)return;
  var fast=(Date.now()-t0)<5000;
  streak=fast?streak+1:0;
  score+=10+Math.min(streak,5)*2;
  var s=$('#sc');s.textContent='Score: '+score+(streak>1?'  🔥 x'+streak:'');
  nextTask();
}
function nextTask(){
  var k;do{k=Math.floor(Math.random()*TASKS.length)}while(k===last);last=k;
  var area=$('#area'),task=$('#task');area.innerHTML='';t0=Date.now();
  TASKS[k](task,area);
}
async function finish(){
  if(!running)return;
  clearInterval(timer);running=false;
  stage.innerHTML='<div class="center"><h1>Time’s up!</h1><p class="mut">Saving your score to the shared leaderboard…</p></div>';
  var saveError=null;
  try{
    await submitScore(name,score);
    await refreshLeaderboard();
  }catch(err){
    saveError=err;
    console.error('Could not save the score:',err);
  }
  var rank=memLb.findIndex(function(r){return r.n===name&&r.s===score})+1;
  stage.innerHTML='';
  var c=h('div','center');
  c.appendChild(h('h1',null,'Time’s up!'));
  c.appendChild(h('div','big pop',score));
  if(saveError){
    c.appendChild(h('p','mut','Your score could not be saved. Please try again later.'));
  }else{
    c.appendChild(h('p',null,rank>0?name+', you’re #'+rank+' on the shared leaderboard.':name+', your score was saved to the shared leaderboard.'));
  }
  var b=h('button','btn','Play again',startScreen);c.appendChild(b);
